<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitor de Inventario</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
    }

    header {
      background: #111827;
      color: white;
      padding: 25px;
      text-align: center;
    }

    .botones {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 15px;
      background: white;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      background: #e5e7eb;
    }

    button.activo {
      background: #2563eb;
      color: white;
    }

    .dashboard {
      display: none;
      padding: 15px;
    }

    .dashboard.activo {
      display: block;
    }

    iframe {
      width: 100%;
      height: 900px;
      border: none;
      background: white;
    }
  </style>
</head>

<body>

  <header>
    <h1>Monitor de Inventario</h1>
    <p>Dashboard integrado</p>
  </header>

  <div class="botones">
    <button class="activo" onclick="verDashboard('dashboard1', this)">Dashboard 1</button>
    <button onclick="verDashboard('dashboard2', this)">Dashboard 2</button>
  </div>

  <div id="dashboard1" class="dashboard activo">
    <iframe src="dashboard-1.html"></iframe>
  </div>

  <div id="dashboard2" class="dashboard">
    <iframe src="dashboard-2.html"></iframe>
  </div>

  <script>
    function verDashboard(id, boton) {
      document.querySelectorAll('.dashboard').forEach(d => d.classList.remove('activo'));
      document.querySelectorAll('button').forEach(b => b.classList.remove('activo'));

      document.getElementById(id).classList.add('activo');
      boton.classList.add('activo');
    }
  </script>

</body>
</html>
